name: erp_app_v2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.1  
  fl_chart: ^0.71.0
  barcode_widget: ^2.0.3
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  package_info_plus: ^9.0.0
  home_widget:
  firebase_remote_config: ^5.0.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  http: ^1.3.0
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  table_calendar: ^3.2.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  google_fonts: ^6.2.1
  circlify: ^1.2.1
  intl:
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/background.jpeg
    - assets/animation.json
    - assets/loginback.json
    - assets/night.json
    - assets/train.json
    - assets/valley.json
    - assets/planet.json
    - assets/centerimage2.jpeg
    - assets/animation2.json
    - assets/back1.json
    - assets/org.png
    - assets/course1.jpg
    - assets/graduation-hat.png
    - assets/Gradient Dots Background.json
    - assets/app_loader1.png
    - assets/line loader.json
    - assets/Loading.json
    - assets/lock_back.png
    - assets/icon.png
